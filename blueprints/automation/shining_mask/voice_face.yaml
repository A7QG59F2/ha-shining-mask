blueprint:
  name: Shining Mask - voice assistant face
  description: >
    Gives a voice satellite (e.g. a TECHO5 Echo Show) a face on a Shining LED mask.
    Each assistant state shows a mask face. "kind" is image (built-in), animation (built-in)
    or diy (uploaded slots; comma list cycles, e.g. "4,5" = talking mouth), or pack (the assistant
    face pack installed with shining_mask.install_face_pack; the value field is ignored).
    Defaults match the slots written by the shining_mask.install_default_faces action.
    When idle (finished speaking), the mask goes back to the face you picked yourself by default.
  domain: automation
  input:
    satellite:
      name: Voice satellite
      selector:
        entity:
          domain: assist_satellite
    mask:
      name: Mask
      selector:
        entity:
          integration: shining_mask
          domain: light
    idle_kind:
      name: Idle - kind
      description: "chosen = go back to the face you picked yourself (dashboard / Image / Animation). Or show a specific image, animation or DIY slot."
      default: chosen
      selector: { select: { options: [chosen, pack, image, animation, diy] } }
    idle_value: { name: Idle - value (ignored for 'chosen'), default: "1", selector: { text: {} } }
    idle_return_seconds:
      name: Idle - then go back to the chosen face after (seconds)
      description: Only used when Idle kind isn't 'chosen'. 0 = keep showing the idle face.
      default: 0
      selector: { number: { min: 0, max: 3600, step: 1, mode: box, unit_of_measurement: s } }
    listening_kind: { name: Listening - kind, default: diy, selector: { select: { options: [pack, image, animation, diy] } } }
    listening_value: { name: Listening - value, default: "2", selector: { text: {} } }
    processing_kind: { name: Thinking - kind, default: diy, selector: { select: { options: [pack, image, animation, diy] } } }
    processing_value: { name: Thinking - value, default: "3", selector: { text: {} } }
    responding_kind: { name: Talking - kind, default: diy, selector: { select: { options: [pack, image, animation, diy] } } }
    responding_value: { name: Talking - value, default: "4,5", selector: { text: {} } }
    talk_speed:
      name: Talking mouth speed
      description: DIY cycle speed while talking (experiment; higher is usually faster).
      default: 220
      selector: { number: { min: 0, max: 255 } }
    error_kind: { name: Unavailable - kind, default: diy, selector: { select: { options: [pack, image, animation, diy] } } }
    error_value: { name: Unavailable - value, default: "6", selector: { text: {} } }
    unavailable_seconds:
      name: Unavailable - give up after (seconds)
      description: How long to show the unavailable face before doing the action below. 0 = never.
      default: 180
      selector: { number: { min: 0, max: 7200, step: 5, mode: box, unit_of_measurement: s } }
    unavailable_then:
      name: Unavailable - then
      description: "off: go black. restore: go back to the face you last picked yourself (dashboard, Image/Animation numbers)."
      default: restore
      selector: { select: { options: [restore, "off"] } }

mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input satellite

variables:
  faces:
    idle: { kind: !input idle_kind, value: !input idle_value }
    listening: { kind: !input listening_kind, value: !input listening_value }
    processing: { kind: !input processing_kind, value: !input processing_value }
    responding: { kind: !input responding_kind, value: !input responding_value }
    unavailable: { kind: !input error_kind, value: !input error_value }
  talk_speed: !input talk_speed
  unavailable_seconds: !input unavailable_seconds
  idle_return_seconds: !input idle_return_seconds
  unavailable_then: !input unavailable_then
  pack_roles:
    idle: idle
    listening: listening
    processing: thinking
    responding: talking
    unavailable: error
  state_key: >
    {% set s = trigger.to_state.state if trigger.to_state else 'unavailable' %}
    {{ s if s in faces else ('unavailable' if s in ['unavailable', 'unknown'] else 'idle') }}

conditions:
  - condition: template
    value_template: "{{ trigger.from_state is none or trigger.from_state.state != trigger.to_state.state }}"

actions:
  # the assistant face always beats the music bars; bars resume when it goes idle/unavailable
  - action: shining_mask.set_music_hold
    target:
      entity_id: !input mask
    data:
      hold: "{{ state_key in ['listening', 'processing', 'responding'] }}"
    continue_on_error: true
  - if:
      - condition: template
        value_template: "{{ faces[state_key].kind == 'chosen' }}"
    then:
      - action: shining_mask.restore_selected
        target:
          entity_id: !input mask
        continue_on_error: true
    else:
      - action: shining_mask.show_face
        target:
          entity_id: !input mask
        data:
          kind: "{{ faces[state_key].kind }}"
          value: "{{ pack_roles[state_key] if faces[state_key].kind == 'pack' else faces[state_key].value }}"
          speed: "{{ talk_speed | int if state_key == 'responding' else 128 }}"
          temporary: true
        continue_on_error: true
  # mode: restart cancels these waits as soon as the satellite changes state again
  - if:
      - condition: template
        value_template: "{{ state_key == 'idle' and faces.idle.kind not in ['chosen'] and (idle_return_seconds | int) > 0 }}"
    then:
      - delay:
          seconds: "{{ idle_return_seconds | int }}"
      - action: shining_mask.restore_selected
        target:
          entity_id: !input mask
        continue_on_error: true
  - if:
      - condition: template
        value_template: "{{ state_key == 'unavailable' and (unavailable_seconds | int) > 0 }}"
    then:
      - delay:
          seconds: "{{ unavailable_seconds | int }}"
      - if:
          - condition: template
            value_template: "{{ unavailable_then == 'off' }}"
        then:
          - action: light.turn_off
            target:
              entity_id: !input mask
        else:
          - action: shining_mask.restore_selected
            target:
              entity_id: !input mask
        continue_on_error: true
