show_image:
  target:
    entity:
      integration: shining_mask
      domain: light
  fields:
    image:
      required: true
      example: 3
      selector:
        number: { min: 1, max: 255, mode: box }

show_animation:
  target:
    entity:
      integration: shining_mask
      domain: light
  fields:
    animation:
      required: true
      example: 2
      selector:
        number: { min: 1, max: 255, mode: box }

play_diy:
  target:
    entity:
      integration: shining_mask
      domain: light
  fields:
    slots:
      required: true
      example: "4,5"
      selector:
        text:
    speed:
      example: 200
      selector:
        number: { min: 0, max: 255 }

show_face:
  target:
    entity:
      integration: shining_mask
      domain: light
  fields:
    kind:
      required: true
      default: diy
      selector:
        select:
          options: [image, animation, diy, pack]
    value:
      required: true
      example: "1"
      selector:
        text:
    speed:
      selector:
        number: { min: 0, max: 255 }
    temporary:
      default: false
      selector:
        boolean:
    hold_music:
      selector:
        boolean:

install_face_pack:
  target:
    entity:
      integration: shining_mask
      domain: light
  fields:
    folder:
      required: true
      example: "1"
      selector:
        text:
    start_slot:
      default: 10
      selector:
        number: { min: 1, max: 200, mode: box }
    fit:
      default: auto
      selector:
        select:
          options: [auto, crop, scale]

loop_animations:
  target:
    entity:
      integration: shining_mask
      domain: light

rhythm:
  target:
    entity:
      integration: shining_mask
      domain: light
  fields:
    mode:
      default: 0
      selector:
        number: { min: 0, max: 4, mode: box }
    levels:
      required: true
      example: "2,5,9,14,15,12,8,5,3,6,10,4; 1,3,6,9,12,15,15,12,9,6,3,1"
      selector:
        text:
    interval:
      default: 0.08
      selector:
        number: { min: 0.02, max: 2, step: 0.01, unit_of_measurement: s }

stop_rhythm:
  target:
    entity:
      integration: shining_mask
      domain: light

set_gesture:
  target:
    entity:
      integration: shining_mask
      domain: light
  fields:
    enabled:
      selector:
        boolean:
    library:
      selector:
        select:
          options: [all, gallery, diy]
    circulation:
      selector:
        select:
          options: [order, random]
    items:
      example: "1, 4, 7-9"
      selector:
        text:

set_music_hold:
  target:
    entity:
      integration: shining_mask
      domain: light
  fields:
    hold:
      required: true
      selector:
        boolean:

restore_selected:
  target:
    entity:
      integration: shining_mask
      domain: light

set_text:
  target:
    entity:
      integration: shining_mask
      domain: light
  fields:
    text:
      required: true
      example: "Happy Halloween"
      selector:
        text:
    color:
      default: [255, 120, 0]
      selector:
        color_rgb:
    mode:
      default: scroll_left
      selector:
        select:
          options: [steady, blink, scroll_left, scroll_right]
    speed:
      selector:
        number: { min: 0, max: 255 }

upload_image:
  target:
    entity:
      integration: shining_mask
      domain: light
  fields:
    slot:
      example: 8
      selector:
        number: { min: 1, max: 34, mode: box }
    path:
      example: /config/www/mask/pumpkin.png
      selector:
        text:
    builtin:
      selector:
        select:
          options: [idle, listening, thinking, talk_closed, talk_open, error, sleep, test_pattern, blank]
    data:
      selector:
        text:
          multiline: true
    name:
      selector:
        text:

install_default_faces:
  target:
    entity:
      integration: shining_mask
      domain: light

install_effect:
  target:
    entity:
      integration: shining_mask
      domain: light
  fields:
    effect:
      default: matrix
      selector:
        select:
          options: [matrix]
    start_slot:
      selector:
        number: { min: 1, max: 30 }
    frames:
      default: 8
      selector:
        number: { min: 4, max: 10 }
    speed:
      default: 200
      selector:
        number: { min: 0, max: 255 }

generate_dashboard:
  target:
    entity:
      integration: shining_mask
      domain: light
  fields:
    columns:
      default: 4
      selector:
        number: { min: 1, max: 12 }

set_pack_role:
  target:
    entity:
      integration: shining_mask
      domain: light
  fields:
    role:
      required: true
      selector:
        select:
          options: [idle, listening, thinking, talking, error, sleep]
    slots:
      required: true
      example: "14"
      selector:
        text:

reset_mask:
  target:
    entity:
      integration: shining_mask
      domain: light
  fields:
    confirm:
      required: true
      default: false
      selector:
        boolean:

delete_diy:
  target:
    entity:
      integration: shining_mask
      domain: light
  fields:
    slots:
      required: true
      example: "1, 4, 7-9"
      selector:
        text:

send_command:
  target:
    entity:
      integration: shining_mask
      domain: light
  fields:
    command:
      required: true
      example: LIGHT
      selector:
        text:
    args:
      example: "80"
      selector:
        text:
